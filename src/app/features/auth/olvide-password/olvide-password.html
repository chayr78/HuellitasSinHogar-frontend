<section class="hs-auth-card hs-card p-4 p-md-5">
  <div class="text-center mb-4">
    <span class="hs-auth-icono" aria-hidden="true">🔑</span>
    <h1 class="h3 fw-extrabold mt-3 mb-1">¿Olvidaste tu contraseña?</h1>
    <p class="text-hs-muted mb-0">Escribe tu correo y te enviaremos un enlace para crear una nueva.</p>
  </div>

  @if (confirmacion(); as mensaje) {
    <div class="hs-alert-ok mb-4" role="status">
      <i class="bi bi-envelope-check me-1" aria-hidden="true"></i>
      {{ mensaje }}
    </div>
    <a routerLink="/login" class="btn btn-primary w-100">Volver a iniciar sesión</a>
  } @else {
    @if (error(); as mensaje) {
      <div class="alert alert-warning" role="alert">{{ mensaje }}</div>
    }

    <form [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
      <div class="mb-4">
        <label for="correo" class="form-label">Correo electrónico</label>
        <input
          id="correo"
          type="email"
          class="form-control"
          formControlName="correo"
          autocomplete="email"
          [class.is-invalid]="invalido(formulario.controls.correo)"
        />
        <div class="invalid-feedback">Escribe un correo válido.</div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="enviando()">
        @if (enviando()) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
          Enviando...
        } @else {
          Enviar enlace
        }
      </button>
    </form>

    <p class="text-center mt-4 mb-0">
      <a routerLink="/login" class="fw-bold text-decoration-none">← Volver a iniciar sesión</a>
    </p>
  }
</section>
