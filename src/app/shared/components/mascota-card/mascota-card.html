@let m = mascota();
@let adoptado = variante() === 'adoptado';
<a [routerLink]="['/mascotas', m.id]" class="tarjeta hs-card hs-card-hover d-flex flex-column h-100 overflow-hidden">
  <div class="marco">
    <app-foto-mascota class="foto" [fotoUrl]="m.fotoUrl" [nombre]="m.nombre" [altura]="240" />
    <span class="estado">
      @if (adoptado) {
        <span class="hs-badge-ok"><i class="bi bi-heart-fill me-1" aria-hidden="true"></i>¡Adoptado!</span>
      } @else {
        <span appBadgeEstado [estado]="m.estado"></span>
      }
    </span>
  </div>

  <div class="cuerpo d-flex flex-column flex-grow-1" [class.pie-adoptado]="adoptado">
    <h2 class="nombre text-truncate">{{ m.nombre }}</h2>
    <p class="small text-hs-muted mb-3">{{ m.edadAproximada }} aprox.</p>
    <ul class="rasgos list-unstyled mb-0">
      <li><i class="bi bi-rulers" aria-hidden="true"></i>{{ etiquetaTamano[m.tamano] }}</li>
      <li><i class="bi bi-lightning-charge" aria-hidden="true"></i>Energía {{ etiquetaEnergia[m.nivelEnergia].toLowerCase() }}</li>
    </ul>
    @if (!adoptado) {
      <span class="conocer mt-auto" aria-hidden="true">Conocer a {{ m.nombre }} <i class="bi bi-arrow-right"></i></span>
    }
  </div>
</a>
