@let m = mascota();
@let adoptado = variante() === 'adoptado';
<a [routerLink]="['/mascotas', m.id]" class="tarjeta d-flex flex-column h-100" [class.adoptado]="adoptado">
  <div class="marco">
    <app-foto-mascota class="foto" [fotoUrl]="m.fotoUrl" [nombre]="m.nombre" proporcion="4 / 4.6" recortar />
    <div class="velo" aria-hidden="true"></div>

    <span class="estado">
      @if (adoptado) {
        <span class="hs-badge-ok"><i class="bi bi-heart-fill me-1" aria-hidden="true"></i>¡Adoptado!</span>
      } @else {
        <span appBadgeEstado [estado]="m.estado"></span>
      }
    </span>

    <div class="identidad">
      <h2 class="nombre">{{ m.nombre }}</h2>
      <p class="edad mb-0">{{ m.edadAproximada }} aprox.</p>
    </div>

    @if (!adoptado) {
      <span class="ir" aria-hidden="true"><i class="bi bi-arrow-up-right"></i></span>
    }
  </div>

  <ul class="rasgos list-unstyled mb-0">
    <li><i class="bi bi-rulers" aria-hidden="true"></i>{{ etiquetaTamano[m.tamano] }}</li>
    <li><i class="bi bi-lightning-charge" aria-hidden="true"></i>Energía {{ etiquetaEnergia[m.nivelEnergia].toLowerCase() }}</li>
  </ul>
</a>
